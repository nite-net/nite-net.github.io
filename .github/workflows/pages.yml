name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The API reference comes from nite's source; rebuild daily so it follows main.
  schedule:
    - cron: "17 5 * * *"
  # Lets the nite repository trigger a rebuild after a push:
  # gh api repos/nite-net/nite-net.github.io/dispatches -f event_type=nite-updated
  repository_dispatch:
    types: [nite-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the nite source (for the API reference)
        uses: actions/checkout@v4
        with:
          repository: nite-net/nite
          path: nite-src

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0

      - name: Build
        run: |
          docfx metadata docfx.json
          docfx build docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
