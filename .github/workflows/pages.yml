name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The API reference comes from nite's source; rebuild daily so it follows main.
  schedule:
    - cron: "17 5 * * *"
  # Lets the nite repository trigger a rebuild after a push:
  # gh api repos/nite-net/nite-net.github.io/dispatches -f event_type=nite-updated
  repository_dispatch:
    types: [nite-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The API reference is generated from nite's source. If that repository is private, the
      # workflow's own token cannot read it: add a NITE_SOURCE_TOKEN secret (a fine-grained token
      # with read access to its contents). Without access, the site builds without the API pages.
      - name: Check out the nite source (for the API reference)
        id: source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: nite-net/nite
          path: nite-src
          token: ${{ secrets.NITE_SOURCE_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0

      - name: Build
        if: steps.source.outcome == 'success'
        run: |
          docfx metadata docfx.json
          docfx build docfx.json --warningsAsErrors

      - name: Build without the API reference
        if: steps.source.outcome != 'success'
        run: |
          echo "::warning title=API reference skipped::Could not check out nite-net/nite, so the site was built without its API pages. If the repository is private, add a NITE_SOURCE_TOKEN secret with read access to it."
          rm -rf nite-src api/index.md
          sed -i '/^- name: API$/,/^  topicHref: api\/index.md$/d' toc.yml
          # Links into the API reference cannot resolve now, so warnings are not errors here.
          docfx build docfx.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
